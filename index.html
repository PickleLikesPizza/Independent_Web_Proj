    <h1>Animating with CSS and JS</h1>

    <h2>first off, we can use CSS to make some spunky animations</h2>
    <label for="anim1">press me!</label>
    <input type="checkbox" id="anim1" style="display:none;">
    <div class="anim1-content">
        <p>surprise! you can make objects appear without javascript</p>
    </div>
    <hr>
    <button onclick="imgfade()">magic button!</button>
    <img id="img" src="https://i.pinimg.com/1200x/90/0a/13/900a13f11af2438b21d55294bd669ddf.jpg">

        <div class="scroll-obj"><h1>but with javascript, you can do a lot of stuff!</h1></div>
    </div>
    <div class="scroll-obj"><h2 class="container">watch what happens when you scroll up and down</h2></div>
    <img id="img" class="scroll-obj" src="https://i.pinimg.com/1200x/ab/b0/fb/abb0fb0b3d9a570abd2f5ace030ef9ac.jpg">
